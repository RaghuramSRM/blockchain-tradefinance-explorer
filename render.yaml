services:
  - type: web
    name: chaindocs
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/chaindocs.sqlite
      - key: JWT_SECRET
        generateValue: true
