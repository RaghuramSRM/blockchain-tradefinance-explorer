<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Documents & Cryptographic Hashing — ChainDocs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <div class="app-wrapper">
        <nav id="sidebar-nav" class="sidebar"></nav>

        <div class="main-content">
            <header class="top-header">
                <div>
                    <h5 class="fw-bold mb-0">Trade Documents & Cryptographic Integrity</h5>
                    <small class="text-muted">Upload trade instruments, verify SHA-256 hashes, and anchor to ledger</small>
                </div>
                <div>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#uploadDocModal">
                        <i class="bi bi-cloud-arrow-up me-1"></i> Upload Document
                    </button>
                </div>
            </header>

            <main class="content-body">
                <!-- Document Cards Grid -->
                <div class="row g-4" id="documentsGrid">
                    <div class="col-12 text-center py-5 text-muted">Loading trade documents...</div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Upload Document -->
    <div class="modal fade" id="uploadDocModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Upload Trade Document</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="uploadDocForm" onsubmit="handleUploadDoc(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Document Type</label>
                            <select id="doc_type" class="form-select">
                                <option value="LOC">Letter of Credit (LOC)</option>
                                <option value="BILL_OF_LADING">Bill of Lading (B/L)</option>
                                <option value="INVOICE">Commercial Invoice</option>
                                <option value="PO">Purchase Order (PO)</option>
                                <option value="COO">Certificate of Origin (COO)</option>
                                <option value="INSURANCE_CERT">Insurance Certificate</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Document Identifier / Number</label>
                            <input type="text" id="doc_number" class="form-control" placeholder="e.g. LOC-2026-SCB-998" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">File Upload (PDF / Image / Docs)</label>
                            <input type="file" id="doc_file" class="form-control" required>
                            <small class="text-muted">Server automatically computes SHA-256 hash upon upload.</small>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary btn-sm">Upload & Anchor Hash</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: Verification Result -->
    <div class="modal fade" id="verifyResultModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Cryptographic Integrity Verification</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <div id="verifyIcon" class="mb-3"></div>
                    <h5 id="verifyTitle" class="fw-bold"></h5>
                    <p id="verifyMsg" class="text-muted small"></p>

                    <div class="text-start bg-light p-3 rounded mt-3 small font-monospace">
                        <div class="mb-2"><b>Document Hash:</b><br><span id="vDocHash" class="text-break text-primary"></span></div>
                        <div><b>Anchored Block Hash:</b><br><span id="vBlockHash" class="text-break text-success"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        App.requireAuth();
        App.initSidebar('documents');

        async function loadDocuments() {
            const res = await App.request('/documents');
            if (!res || !res.ok) return;

            const grid = document.getElementById('documentsGrid');
            if (!res.data.data.length) {
                grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">No trade documents found.</div>`;
                return;
            }

            grid.innerHTML = res.data.data.map(doc => `
                <div class="col-md-4">
                    <div class="metric-card h-100 d-flex flex-direction-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge bg-primary bg-opacity-10 text-primary fw-bold">${doc.doc_type}</span>
                                <span class="small text-muted">${new Date(doc.issued_at).toLocaleDateString()}</span>
                            </div>
                            <h6 class="fw-bold text-dark text-truncate mb-1">${doc.doc_number}</h6>
                            <div class="small text-muted mb-2 text-truncate">${doc.original_filename}</div>
                            <div class="mb-3">
                                <small class="text-muted d-block mb-1">SHA-256 Digest:</small>
                                <div class="hash-pill">${doc.sha256_hash.substring(0, 24)}...</div>
                            </div>
                        </div>
                        <div class="pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="small text-muted"><i class="bi bi-building"></i> ${doc.org_name}</span>
                            <button class="btn btn-sm btn-outline-success" onclick="verifyDoc('${doc.id}')">
                                <i class="bi bi-shield-check"></i> Verify Hash
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function handleUploadDoc(e) {
            e.preventDefault();
            const docType = document.getElementById('doc_type').value;
            const docNumber = document.getElementById('doc_number').value;
            const fileInput = document.getElementById('doc_file');

            const formData = new FormData();
            formData.append('doc_type', docType);
            formData.append('doc_number', docNumber);
            if (fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            }

            const token = App.getToken();
            const res = await fetch('/api/documents', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('uploadDocModal')).hide();
                document.getElementById('uploadDocForm').reset();
                loadDocuments();
            } else {
                alert('Document upload failed.');
            }
        }

        async function verifyDoc(id) {
            const res = await App.request(`/documents/${id}/verify`, { method: 'POST' });
            if (!res || !res.ok) return;

            const modal = new bootstrap.Modal(document.getElementById('verifyResultModal'));
            const data = res.data;

            if (data.verified) {
                document.getElementById('verifyIcon').innerHTML = `<i class="bi bi-check-circle-fill text-success display-4"></i>`;
                document.getElementById('verifyTitle').textContent = 'Cryptographically Verified';
                document.getElementById('verifyMsg').textContent = 'Document digest matches the immutable blockchain ledger block with zero tampering.';
            } else {
                document.getElementById('verifyIcon').innerHTML = `<i class="bi bi-x-circle-fill text-danger display-4"></i>`;
                document.getElementById('verifyTitle').textContent = 'Verification Warning';
                document.getElementById('verifyMsg').textContent = 'Document hash not found or hash chain discrepancy detected.';
            }

            document.getElementById('vDocHash').textContent = data.sha256_hash;
            document.getElementById('vBlockHash').textContent = data.ledger_entry_hash || 'N/A';
            modal.show();
        }

        document.addEventListener('DOMContentLoaded', loadDocuments);
    </script>
</body>
</html>
