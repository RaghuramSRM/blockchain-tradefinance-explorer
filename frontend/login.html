<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — ChainDocs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">

    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <a href="/" class="d-inline-flex align-items-center gap-2 text-decoration-none text-dark fw-bold fs-3">
                <i class="bi bi-shield-shaded text-info fs-2"></i> ChainDocs
            </a>
            <p class="text-muted small mt-1">Sign in to your Trade Finance Explorer account</p>
        </div>

        <div class="metric-card p-4">
            <div id="alert-box" class="alert alert-danger d-none py-2 small"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="user@domain.com" required>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small fw-semibold">Password</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                    <span id="btnText">Sign In to Platform</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <span class="small text-muted">Don't have an enterprise account? </span>
                <a href="/register.html" class="small fw-semibold text-primary text-decoration-none">Register here</a>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            alertBox.classList.add('d-none');

            // Client-side validation (Exercise 3 Rubric)
            if (!Validator.validateEmail(email)) {
                Validator.showError('email', 'Please provide a valid email format.');
                return;
            } else {
                Validator.clearError('email');
            }

            if (!password) {
                Validator.showError('password', 'Password cannot be blank.');
                return;
            } else {
                Validator.clearError('password');
            }

            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');

            const res = await App.request('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });

            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');

            if (res && res.ok && res.data.access_token) {
                App.setSession(res.data.access_token, res.data.user);
                window.location.href = '/dashboard.html';
            } else {
                alertBox.textContent = res?.data?.message || 'Invalid credentials. Please try again.';
                alertBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
